<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title description">
  <title id="title">From signals to decisions</title>
  <desc id="description">Parallax architecture: evidence, signals, customer and company councils, and a human product decision. Provenance and uncertainty travel through every stage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081525"/>
      <stop offset="1" stop-color="#132b47"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="94" y1="232" x2="1186" y2="232">
      <stop stop-color="#487cc4"/>
      <stop offset="0.6" stop-color="#80adf2"/>
      <stop offset="1" stop-color="#8cddc0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8baed9" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="450" rx="20" fill="url(#background)"/>
  <rect width="1280" height="450" rx="20" fill="url(#grid)"/>
  <path d="M920 0L1280 340M1040 0L1280 220M800 0L1250 450" stroke="#72a9ec" stroke-opacity=".07" fill="none"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="56" y="45" width="5" height="17" rx="2" fill="#72a9ff"/>
    <text x="75" y="59" fill="#a7c5ec" font-size="13" letter-spacing="2.8" font-weight="600">PARALLAX / PRODUCT DECISIONS</text>
    <text x="1224" y="59" text-anchor="end" fill="#92abc8" font-size="12" letter-spacing="1.8">SYSTEM ARCHITECTURE</text>

    <text x="56" y="137" fill="#f5f8fe" font-size="49" font-weight="650" letter-spacing="-1.8">From signals to decisions.</text>
    <text x="58" y="174" fill="#b0c2d8" font-size="18">Traceable evidence. Explainable priorities. Human authority.</text>

    <path d="M94 232H1186" fill="none" stroke="url(#rail)" stroke-width="2"/>
    <g fill="#0d2036" stroke="#82b0f0" stroke-width="2">
      <circle cx="94" cy="232" r="6"/>
      <circle cx="383" cy="232" r="6"/>
      <circle cx="672" cy="232" r="6"/>
    </g>
    <circle cx="961" cy="232" r="6" fill="#96dfc2" stroke="#96dfc2" stroke-width="2"/>
    <path d="M1179 227L1186 232L1179 237" fill="none" stroke="#96dfc2" stroke-width="2"/>

    <g stroke="#36516f" fill="#10253d">
      <rect x="56" y="254" width="263" height="121" rx="12"/>
      <rect x="345" y="254" width="263" height="121" rx="12"/>
      <rect x="634" y="254" width="263" height="121" rx="12"/>
    </g>
    <rect x="923" y="254" width="301" height="121" rx="12" fill="#133532" stroke="#508d79"/>

    <g fill="#84abe0" font-size="11" letter-spacing="2" font-weight="600">
      <text x="78" y="280">01 / EVIDENCE</text>
      <text x="367" y="280">02 / INTERPRETATION</text>
      <text x="656" y="280">03 / DELIBERATION</text>
    </g>
    <text x="945" y="280" fill="#97d9c1" font-size="11" letter-spacing="2" font-weight="600">04 / PRODUCT DECISION</text>
    <g fill="#f0f5fd" font-size="21" font-weight="600">
      <text x="78" y="312">Preserve the source</text>
      <text x="367" y="312">Structure the need</text>
      <text x="656" y="312">Challenge the draft</text>
      <text x="945" y="312">Put the PM in control</text>
    </g>
    <g fill="#a9bfd9" font-size="13">
      <text x="78" y="344">Records · claims · frozen intake</text>
      <text x="367" y="344">Groups · cards · requirements</text>
      <text x="656" y="344">Customer + company councils</text>
    </g>
    <text x="945" y="344" fill="#b1d3c6" font-size="13">Inspect · revise · decide · audit</text>
    <text x="57" y="417" fill="#91aac7" font-size="12" letter-spacing=".5">PROVENANCE + UNCERTAINTY TRAVEL WITH EVERY ARTIFACT</text>
    <text x="1224" y="417" text-anchor="end" fill="#91aac7" font-size="12" letter-spacing=".5">BMW · SUCCESSOR VEHICLES · 3–5 YEARS</text>
  </g>
</svg>
